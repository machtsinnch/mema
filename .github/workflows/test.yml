name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: Run session-1 simulation
        env:
          MACHTSINN_RATE_LIMIT_BURST: "10000"
          MACHTSINN_RATE_LIMIT_RPS: "1000"
        run: |
          bun src/index.ts > /tmp/sim1.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          bash scripts/simulate.sh
          kill $SERVER_PID 2>/dev/null || true

      - name: Run session-2 simulation
        env:
          MACHTSINN_RATE_LIMIT_BURST: "10000"
          MACHTSINN_RATE_LIMIT_RPS: "1000"
        run: |
          rm -rf data
          bun src/index.ts > /tmp/sim2.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          bash scripts/simulate-session2.sh
          kill $SERVER_PID 2>/dev/null || true
